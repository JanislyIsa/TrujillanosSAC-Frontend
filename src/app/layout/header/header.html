<header class="cabecera">
  <div class="contenedor cabecera__fila">
    <a routerLink="/catalogo" class="marca" aria-label="El Trujillano, ir al catálogo">
      <span class="marca__icono" aria-hidden="true"><img src="img/logo-payaso.png" alt="" width="300" height="300" /></span>
      <span class="marca__texto">El Trujillano</span>
    </a>

    <form class="busqueda" role="search" (submit)="buscar($event, texto.value)">
      <label class="visualmente-oculto" for="busqueda">Buscar golosinas</label>
      <input #texto id="busqueda" type="search" name="q" placeholder="¿Qué desea hoy?" autocomplete="off" />
      <button type="submit" class="busqueda__boton" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" />
        </svg>
      </button>
    </form>

    <nav class="opciones" aria-label="Cuenta y carrito">
      <!-- Solo se muestra cuando la sesión es de un trabajador de la empresa. -->
      @if (auth.esEmpleado()) {
        <a class="opcion" routerLink="/intranet" aria-label="Ir a la intranet de empleados">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" />
          </svg>
          <span class="opcion__texto">Intranet</span>
        </a>
      }
      <!-- Proveedor con sesión: acceso a su portal de cotizaciones. -->
      @if (auth.esProveedor()) {
        <a class="opcion" routerLink="/proveedor" aria-label="Ir al portal de proveedores">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7l9-4 9 4v10l-9 4-9-4V7zM3 7l9 4 9-4M12 11v10" />
          </svg>
          <span class="opcion__texto">Proveedores</span>
        </a>
      }
      <a class="opcion" [routerLink]="auth.autenticado() ? '/cuenta' : '/login'"
        [attr.aria-label]="auth.autenticado() ? 'Mi cuenta, ' + auth.primerNombre() : 'Iniciar sesión o ver mi cuenta'">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" /><circle cx="12" cy="10" r="3" /><path d="M6.5 18.5c1.2-2.2 3.2-3.2 5.5-3.2s4.3 1 5.5 3.2" />
        </svg>
        <span class="opcion__texto">{{ auth.autenticado() ? auth.primerNombre() : 'Mi cuenta' }}</span>
      </a>
      <a class="opcion opcion--carrito" routerLink="/carrito"
        [attr.aria-label]="'Carrito, ' + carrito.cantidadTotal() + ' unidades'">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 4h2.5l2.2 10.5h9.6L19.5 7H6.3" /><circle cx="9" cy="19" r="1.4" /><circle cx="17" cy="19" r="1.4" />
        </svg>
        @if (carrito.cantidadTotal() > 0) {
          <span class="insignia" aria-hidden="true">{{ carrito.cantidadTotal() }}</span>
        }
      </a>
    </nav>
  </div>
</header>
